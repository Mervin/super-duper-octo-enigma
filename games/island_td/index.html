<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="islandTdTitle">Island TD</title>
    <style>
        body { font-family: monospace; background-color: #1a1a1a; color: #eee; margin: 0; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; background: #2c3e50; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; border-bottom: 2px solid #34495e; }

        main { display: flex; gap: 20px; margin-top: 20px; max-width: 1200px; width: 100%; padding: 0 20px; box-sizing: border-box; }

        #game-container { position: relative; width: 600px; height: 600px; background: #004d40; border: 4px solid #00251a; overflow: hidden; }
        #grid { display: grid; grid-template-columns: repeat(20, 30px); grid-template-rows: repeat(20, 30px); width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        .tile { width: 30px; height: 30px; box-sizing: border-box; border: 1px solid rgba(0,0,0,0.1); cursor: pointer; transition: background-color 0.2s; position: relative; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }
        .tile.fog { background-color: #333; }
        .tile.fog:hover { background-color: #555; }
        .tile.grass { background-color: #4caf50; }
        .tile.path { background-color: #d7ccc8; }
        .tile.base { background-color: #2196f3; font-weight: bold; }
        .tile.spawn { background-color: #f44336; }
        .tile.selected { border: 2px solid yellow; z-index: 10; }

        #entities-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .enemy { position: absolute; width: 20px; height: 20px; background: red; border-radius: 50%; transform: translate(-50%, -50%); transition: left 0.1s linear, top 0.1s linear; display: flex; justify-content: center; align-items: center; font-size: 0.6rem; color: white; }
        .projectile { position: absolute; width: 6px; height: 6px; background: yellow; border-radius: 50%; transform: translate(-50%, -50%); transition: left 0.1s linear, top 0.1s linear; }

        aside { width: 300px; background: #2c3e50; border-radius: 10px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .panel-section { margin-bottom: 20px; border-bottom: 1px solid #34495e; padding-bottom: 10px; }
        .stat { font-size: 1.2rem; margin-bottom: 5px; }

        button { padding: 8px 15px; border: none; border-radius: 5px; background: #3498db; color: white; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 5px; }
        button:hover { background: #2980b9; }
        button:disabled { background: #7f8c8d; cursor: not-allowed; }

        #lang-select { background: white; color: black; border: none; padding: 5px; border-radius: 4px; }

        .tooltip { position: absolute; background: rgba(0,0,0,0.8); color: white; padding: 5px; border-radius: 4px; pointer-events: none; font-size: 0.8rem; z-index: 100; display: none; }
    </style>
</head>
<body>
    <header>
        <h1 data-i18n="islandTdTitle" style="margin:0; font-size: 1.5rem;">Island TD</h1>
        <div>
            <span data-i18n="gold">Gold</span>: <span id="gold-display">50</span> |
            <span data-i18n="lives">Lives</span>: <span id="lives-display">20</span> |
            <span data-i18n="wave">Wave</span>: <span id="wave-display">1</span>
        </div>
        <div>
            <select id="lang-select">
                <option value="en">EN</option>
                <option value="cz">CZ</option>
            </select>
            <a href="../../index.html" style="color: white; text-decoration: none; margin-left: 10px;" data-i18n="backToHub">Back to Hub</a>
        </div>
    </header>

    <main>
        <div id="game-container">
            <div id="grid"></div>
            <div id="entities-layer"></div>
            <div id="tooltip" class="tooltip"></div>
        </div>

        <aside>
            <div class="panel-section">
                <h3 data-i18n="actions">Actions</h3>
                <div id="tile-info" style="min-height: 40px; margin-bottom: 10px; color: #aaa;">Select a tile</div>
                <button id="btn-dig" disabled data-i18n="digPath">Dig Path (10g)</button>
                <button id="btn-build-tower" disabled data-i18n="buildTower">Build Tower (20g)</button>
            </div>

            <div class="panel-section">
                <h3 data-i18n="waveControl">Wave Control</h3>
                <button id="btn-start-wave" data-i18n="startWave">Start Wave</button>
            </div>

            <div class="panel-section">
                <h3 data-i18n="permaUpgrades">Perma Upgrades (Relics: <span id="relics-display">0</span>)</h3>
                <button id="btn-upg-dmg" data-i18n="upgDmg">Tower Dmg +1 (1 Relic)</button>
            </div>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="farmTitle">Farm Idle</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #7bc043; color: #333; margin: 0; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; background: #4a7c29; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .currency { font-size: 1.5rem; font-weight: bold; background: rgba(0,0,0,0.2); padding: 5px 15px; border-radius: 20px; }
        .hub-link { color: white; text-decoration: none; background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 5px; }

        main { display: flex; gap: 20px; margin-top: 20px; max-width: 1000px; width: 100%; padding: 0 20px; box-sizing: border-box; }

        #farm-grid { display: grid; grid-template-columns: repeat(4, 100px); grid-template-rows: repeat(4, 100px); gap: 10px; flex: 1; justify-content: center; }
        .plot { width: 100px; height: 100px; background-color: #8b5a2b; border: 3px solid #5c3a21; border-radius: 8px; cursor: pointer; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 3rem; }
        .plot:hover { border-color: #d2b48c; }
        .plot.locked { background-color: #555; border-color: #333; cursor: not-allowed; opacity: 0.8; }
        .plot.growing { cursor: default; }
        .plot .progress { position: absolute; bottom: 0; left: 0; width: 100%; height: 5px; background: rgba(255,255,255,0.5); }
        .plot .progress-fill { height: 100%; background: #32cd32; width: 0%; transition: width 1s linear; }

        aside { width: 300px; background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        h2 { margin-top: 0; color: #4a7c29; }
        .seed-btn { display: flex; justify-content: space-between; align-items: center; padding: 10px; margin-bottom: 10px; border: 2px solid #ccc; border-radius: 8px; cursor: pointer; background: #f9f9f9; }
        .seed-btn.selected { border-color: #4a7c29; background: #e8f5e9; }
        .seed-btn span { font-weight: bold; }

        button { padding: 8px 15px; border: none; border-radius: 5px; background: #4a7c29; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #3a6220; }
        #lang-select { background: white; color: black; border: none; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>
    <header>
        <h1 data-i18n="farmTitle" style="margin:0; font-size: 1.5rem;">Farm Idle</h1>
        <div class="currency"><span data-i18n="coins">Coins</span>: <span id="coins-display">0</span></div>
        <div>
            <select id="lang-select">
                <option value="en">EN</option>
                <option value="cz">CZ</option>
            </select>
            <a href="../../index.html" class="hub-link" data-i18n="backToHub">Back to Hub</a>
        </div>
    </header>

    <main>
        <div id="farm-grid">
            <!-- Generated via JS -->
        </div>

        <aside>
            <h2 data-i18n="shop">Shop & Seeds</h2>
            <div id="seeds-container">
                <!-- Generated via JS -->
            </div>
            <hr>
            <h3 data-i18n="upgrades">Upgrades</h3>
            <button id="btn-buy-plot" style="width:100%"><span data-i18n="buyPlot">Buy Plot</span> (<span id="plot-cost">50</span>)</button>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>

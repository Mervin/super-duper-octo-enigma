<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="spiderTitle">Spider Solitaire</title>
    <style>
        body { background-color: #076324; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        #game-board { width: 1100px; position: relative; height: 800px; }
        .pile { width: 100px; height: 140px; border: 2px solid rgba(255,255,255,0.2); border-radius: 5px; position: absolute; }
        .card { width: 100px; height: 140px; background-color: white; border: 1px solid #333; border-radius: 5px; position: absolute; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; cursor: grab; user-select: none; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); background-image: url('data:image/svg+xml;utf8,<svg width="10" height="10" xmlns="http://www.w3.org/2000/svg"><rect width="10" height="10" fill="white"/></svg>'); }
        .card.back { background-color: #0b3d91; background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.1) 10px, rgba(255,255,255,0.1) 20px); color: transparent !important; cursor: default; }
        .red { color: red; }
        .black { color: black; }
        .dragging { z-index: 1000 !important; opacity: 0.9; cursor: grabbing; }
        button, select { padding: 5px 10px; font-size: 1rem; }
        #lang-select { position: absolute; top: 10px; right: 10px; }
        #completed-sets { display: flex; gap: 10px; position: absolute; left: 140px; top: 20px; }
        .completed-set { width: 100px; height: 140px; background-color: white; color: black; border: 1px solid #333; border-radius: 5px; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; }
    </style>
</head>
<body>
    <select id="lang-select">
        <option value="en">EN</option>
        <option value="cz">CZ</option>
    </select>
    <h1 data-i18n="spiderTitle">Spider Solitaire</h1>

    <div class="controls">
        <select id="difficulty">
            <option value="1" data-i18n="1suit">1 Suit</option>
            <option value="2" data-i18n="2suit">2 Suits</option>
            <option value="4" data-i18n="4suit">4 Suits</option>
        </select>
        <button id="btn-new-game" data-i18n="newGame">New Game</button>
        <a href="../../index.html" style="text-decoration: none;"><button data-i18n="backToHub">Back to Hub</button></a>
    </div>

    <div id="game-board">
        <!-- Stock -->
        <div id="stock" class="pile" style="left: 20px; top: 20px;"></div>

        <!-- Completed Sets -->
        <div id="completed-sets"></div>

        <!-- Tableaus (10 columns) -->
        <div id="t0" class="pile" style="left: 20px; top: 180px;"></div>
        <div id="t1" class="pile" style="left: 130px; top: 180px;"></div>
        <div id="t2" class="pile" style="left: 240px; top: 180px;"></div>
        <div id="t3" class="pile" style="left: 350px; top: 180px;"></div>
        <div id="t4" class="pile" style="left: 460px; top: 180px;"></div>
        <div id="t5" class="pile" style="left: 570px; top: 180px;"></div>
        <div id="t6" class="pile" style="left: 680px; top: 180px;"></div>
        <div id="t7" class="pile" style="left: 790px; top: 180px;"></div>
        <div id="t8" class="pile" style="left: 900px; top: 180px;"></div>
        <div id="t9" class="pile" style="left: 1010px; top: 180px;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
